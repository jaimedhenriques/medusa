  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # Docs site: SEPARATE, private, never published.
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels: ["docs", "dependencies"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
